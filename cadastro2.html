<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Etapa 2</title>
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="icon" type="image/png" href="img/iconb.png">
</head>
<body>
    
    <header>
        <div class="topo">
            <img src="img/logo.png" alt="Logo do DevHub" class="logo">
        </div>
        <nav>
            <a href="index.html">Início</a>
         
        </nav>
    </header>

    <div class="main-container">
        <aside class="lateral">
            <div class="lateral-conteudo">
                <h1>Você imagina, nós desenvolvemos.</h1>
                <p>Crie seu cadastro em segundos, centralize suas propostas comerciais e conecte-se sem intermediários burocráticos ou taxas abusivas.</p>
            </div>
            <div class="lateral-rodape">
                <span>© DEVHUB 2026</span>
                <span> BRASIL</span>
            </div>
        </aside>
        <main class="form-area">
            <div class="form-wrapper">
                <form id="formularioCadastro2">
                    <div class="step-header">Etapa 02 de 03</div>
                    <h2 class="step-title">Detalhes Corporativos</h2>
                    <div class="progress-container">
                        <div class="progress-bar active"></div>
                        <div class="progress-bar active"></div>
                        <div class="progress-bar"></div>
                    </div>
                    <div class="form-group">
                        <label>Nome da Empresa ou Projeto</label>
                        <input type="text" id="nomeEmpresa" placeholder="Ex: DevHub Criação de sites" required>
                    </div>
                    <div class="form-group">
                        <label>Setor Comercial</label>
                        <select id="setorComercial">
                            <option>Tecnologia</option>
                            <option>E-commerce / Varejo</option>
                            <option>Marketing / Agência</option>
                            <option>Meios de Comunicação</option>
                            <option>Outros</option>
                        </select>
                    </div>
                    <div class="form-footer">
                        <button type="button" class="btn-cancelar" onclick="window.location.href='cadastro1.html'">← Voltar</button>
                        <button type="submit" class="btn-continuar">Continuar →</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="js/cadastro.js"></script>
</body>
</html>
