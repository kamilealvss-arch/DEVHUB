<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevHub - Redefinir Senha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" type="image/png" href="img/iconb.png">
</head>
<body>

    <header>
        <div class="topo">
    <a href="index.html">
        <img src="img/logo.png" alt="Logo do DevHub" class="logo">
    </a>
</div>
    </header>

    <div class="main-login-container">
        <div class="login-split-box" style="max-width: 500px; margin: 0 auto;">
            <div class="form-panel" style="width: 100%;">
                <div class="logo-area">
                    <img src="img/brilho.png" alt="Estrela DevHub" class="estrela-devhub">
                </div>
                
                <h2 class="panel-title">Criar Nova Senha</h2>
                <p class="login-subtitle">Digite sua nova senha de acesso abaixo para atualizar sua conta.</p>
                
                <form id="form-nova-senha">
                    <div class="input-group password-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="nova-senha" placeholder="Digite a nova senha (mínimo 6 caracteres)" required minlength="6">
                        <span class="input-underline"></span>
                    </div>

                    <button type="submit" class="main-action-btn">Atualizar Senha</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/esqueceu.js"></script>
</body>
</html>
