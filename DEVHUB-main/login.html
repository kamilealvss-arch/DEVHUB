<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevHub - Acessar Conta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" type="image/png" href="img/iconb.png">

</head>


<body>

    <header>
        <div class="topo">
    <a href="index.html">
        <img src="img/logo.png" alt="Logo do DevHub" class="logo">
    </a>
</div>
    </header>


    <div class="main-login-container">
        <div class="login-split-box">

            <div class="form-panel">
                <div class="logo-area">
                    <img src="img/brilho.png" alt="Estrela DevHub" class="estrela-devhub">
                </div>

                <h2 class="panel-title">Acessar Central do Solicitante</h2>
                <p class="login-subtitle">Insira seus dados de acesso para ver suas solicitações ou criar novos
                    projetos.</p>

                <form id="formularioLogin">

                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="seu@email.com" required>
                        <span class="input-underline"></span>
                    </div>

                    <div class="input-group password-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginSenha" placeholder="••••••••" required>
                        <span class="input-underline"></span>

                    </div>

                    <div class="options-group">
                        <label class="remember-me">
                            <input type="checkbox" id="lembrarMe">
                            <span class="checkmark"><i class="fas fa-check"></i></span>
                            Lembrar-me
                        </label>
                        <a href="login-dev.html" class="forgot-password">Entrar como desenvolvedor</a>
                    </div>


                    <button type="submit" class="main-action-btn">Entrar no Painel </button>
                </form>

            </div>

            <div class="welcome-panel">
                <div class="welcome-content">
                    <h1 class="welcome-title">Bem-vindo<br>de volta!</h1>
                    <p class="welcome-desc">Acesse seu painel para acompanhar suas propostas, gerenciar seus projetos e
                        conectar-se com programadores.</p>
                    <div class="brilho-icon-box">
                        <img src="img/brilho.png" alt="Brilho DevHub" class="estrela-decorativa">
                    </div>
                </div>
                <button type="button" class="side-action-btn" onclick="window.location.href='cadastro1.html'">Criar
                    Conta</button>
            </div>


        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
    <script src="./js/login.js" defer></script>
</body>


</html>
